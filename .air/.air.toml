# research/.air/.air.toml


# Working directory
# . or absolute path, please note that the directories following must be under root.
root = "."
tmp_dir = ".air/tmp"


# Just plain old shell command. You could use `make` as well.
## USE for local

# Config file for air
[build]
    cmd = "go build -tags local -o .air/tmp/api /app/cmd/api"
    bin = "./.air/main"
    full_bin = "APP_ENV=devAPP_USER=air exec .air/tmp/api"
    watch_dir = ["./"]
    exclude_dir = ["vendor", ".air"]
    include_ext = ["go", "tpl", "html"]
    exclude_ext = ["swp", "log"]
    delay = 1000
    stop_on_error = true
